<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | MediCitas</title>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="estilos-app.css">
</head>
<body class="fondo-auth">

    <div class="auth-contenedor">

        <div class="auth-logo">

            <span class="logo-icono logo-icono-grande">♥</span>

            <h1>MediCitas</h1>

        </div>

        <div class="auth-tarjeta">

            <h2>Crear cuenta de paciente</h2>

            <form id="formRegistro">

                <div class="campo">

                    <label for="nombreCompleto">Nombre completo</label>

                    <input
                        type="text"
                        id="nombreCompleto"
                        placeholder="Juan Pérez"
                        maxlength="120"
                    >

                </div>

                <div class="campo">

                    <label for="correo">Correo electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="tu@email.com"
                    >

                </div>

                <div class="campo">

                    <label for="telefono">Teléfono</label>

                    <input
                        type="tel"
                        id="telefono"
                        placeholder="(555) 123-4567"
                        maxlength="30"
                    >

                </div>

                <div class="campo">

                    <label for="contrasena">Contraseña</label>

                    <input
                        type="password"
                        id="contrasena"
                        placeholder="Mínimo 8 caracteres"
                    >

                </div>

                <div class="campo">

                    <label for="confirmarContrasena">Confirmar contraseña</label>

                    <input
                        type="password"
                        id="confirmarContrasena"
                        placeholder="••••••••"
                    >

                </div>

                <button
                    type="submit"
                    id="btnRegistrar"
                    class="btn btn-primario btn-ancho">
                    Registrarse
                </button>

            </form>

            <p class="auth-enlace">
                ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
            </p>

            <p class="nota centrado">
                ¿Eres doctor? Tu cuenta la crea la clínica.
            </p>

        </div>

        <a href="index.html" class="volver-inicio">← Volver al inicio</a>

    </div>

    <script src="js/api.js"></script>

    <script>

        // ========================================
        // ENVÍO DEL FORMULARIO DE REGISTRO
        // ========================================

        const formRegistro =
            document.getElementById("formRegistro");

        formRegistro.addEventListener("submit", async function(evento) {

            evento.preventDefault();

            const nombre =
                document.getElementById("nombreCompleto").value.trim();

            const correo =
                document.getElementById("correo").value.trim();

            const telefono =
                document.getElementById("telefono").value.trim();

            const contrasena =
                document.getElementById("contrasena").value;

            const confirmarContrasena =
                document.getElementById("confirmarContrasena").value;


            if (
                nombre === "" ||
                correo === "" ||
                telefono === "" ||
                contrasena === "" ||
                confirmarContrasena === ""
            ) {

                mostrarMensaje(
                    "Por favor, completa todos los campos.",
                    "error"
                );

                return;

            }

            if (contrasena.length < 8) {

                mostrarMensaje(
                    "La contraseña debe tener al menos 8 caracteres.",
                    "error"
                );

                return;

            }

            if (contrasena !== confirmarContrasena) {

                mostrarMensaje("Las contraseñas no coinciden.", "error");

                return;

            }


            const boton = document.getElementById("btnRegistrar");

            boton.disabled = true;

            try {

                await llamarApi("/auth/registro", {

                    metodo: "POST",

                    cuerpo: {
                        nombre: nombre,
                        correo: correo,
                        telefono: telefono,
                        contrasena: contrasena
                    }

                });

                mostrarMensaje(
                    "Cuenta creada. Ya puedes iniciar sesión.",
                    "exito"
                );

                setTimeout(function() {

                    window.location.href = "login.html";

                }, 1200);

            } catch (error) {

                mostrarMensaje(error.message, "error");

                boton.disabled = false;

            }

        });

    </script>

</body>
</html>
