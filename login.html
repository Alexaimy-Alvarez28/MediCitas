<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | MediCitas</title>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="estilos-app.css">
</head>
<body class="fondo-auth">

    <div class="auth-contenedor">

        <div class="auth-logo">

            <span class="logo-icono logo-icono-grande">♥</span>

            <h1>MediCitas</h1>

        </div>

        <div class="auth-tarjeta">

            <h2>Iniciar sesión</h2>

            <form id="formLogin">

                <div class="campo">

                    <label for="correoLogin">Correo</label>

                    <input
                        type="email"
                        id="correoLogin"
                        placeholder="tu@email.com"
                    >

                </div>

                <div class="campo">

                    <label for="contrasenaLogin">Contraseña</label>

                    <input
                        type="password"
                        id="contrasenaLogin"
                        placeholder="••••••••"
                    >

                </div>

                <button
                    type="submit"
                    id="btnEntrar"
                    class="btn btn-primario btn-ancho">
                    Entrar
                </button>

            </form>

            <p class="auth-enlace">
                ¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
            </p>

        </div>

        <a href="index.html" class="volver-inicio">← Volver al inicio</a>

    </div>

    <script src="js/api.js"></script>

    <script>

        // ========================================
        // AVISO PENDIENTE (por ejemplo, "Tu sesión expiró")
        // ========================================

        const avisoPendiente =
            sessionStorage.getItem("medicitas_aviso");

        if (avisoPendiente) {

            mostrarMensaje(avisoPendiente, "info");

            sessionStorage.removeItem("medicitas_aviso");

        }


        // ========================================
        // ENVÍO DEL FORMULARIO DE LOGIN
        // ========================================

        const formLogin =
            document.getElementById("formLogin");

        formLogin.addEventListener("submit", async function(evento) {

            evento.preventDefault();

            const correo =
                document.getElementById("correoLogin").value.trim();

            const contrasena =
                document.getElementById("contrasenaLogin").value;

            if (correo === "" || contrasena === "") {

                mostrarMensaje(
                    "Por favor, completa todos los campos.",
                    "error"
                );

                return;

            }

            const boton = document.getElementById("btnEntrar");

            boton.disabled = true;

            try {

                const datos = await llamarApi("/auth/login", {

                    metodo: "POST",

                    cuerpo: { correo: correo, contrasena: contrasena }

                });

                guardarSesion(datos.token, datos.usuario);

                window.location.href =
                    PANEL_POR_ROL[datos.usuario.rol] || "login.html";

            } catch (error) {

                mostrarMensaje(error.message, "error");

                boton.disabled = false;

            }

        });

    </script>

</body>
</html>
